; DPÜ Robot ve Otomasyon Topluluğu · ESP32 Eğitimi
; ESP32-S3-DevKitC-1 N16R8 (16 MB Flash + 8 MB PSRAM) için ayarlar.
;
; Kodu derleyip yüklemek:       pio run -t upload
; Web sitesini (web/) yüklemek: pio run -t uploadfs
; Seri monitör:                 pio device monitor

[platformio]
; Web sitesi dosyaları bu klasörden kartın hafızasına (LittleFS) yüklenir.
data_dir = web

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash + PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; Kütüphaneler internetten indirilmez; hepsi bu projenin lib/ klasöründe:
;   lib/ESPAsyncWebServer, lib/AsyncTCP, lib/ArduinoJson

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
; Monitör açılınca kart yükleme moduna düşmesin (USB-Serial/JTAG + macOS)
monitor_dtr = 1
monitor_rts = 0
monitor_filters = esp32_exception_decoder
